<script>
(function(){
  var btn=document.getElementById('theme-toggle');
  if(!btn)return;
  var key='mkt-theme';
  function apply(t){document.documentElement.setAttribute('data-theme',t);btn.textContent=t==='dark'?'☀️':'🌙';}
  var saved=localStorage.getItem(key);
  if(saved)apply(saved);
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)apply('dark');
  btn.addEventListener('click',function(){var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';localStorage.setItem(key,cur);apply(cur);});
})();
</script>
